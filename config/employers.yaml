# ============================================================================
# Employer watchlist (buy-side / quant / MM / prop / market-trading desks).
#
# schema per entry:
#   id:          stable slug (primary key, never change once set)
#   name:        display name
#   type:        HF | MM | PROP | QUANT | BANK
#   tier:        1 = top priority coverage, 2 = secondary
#   ats:         greenhouse | lever | ashby | recruitee | workable | smartrecruiters
#                | workday | custom | unknown
#   token:       board token for the ATS (when ats is a JSON provider)
#   careers_url: human careers page (used by detect_ats + frontend deep links)
#   status:      verified  (endpoint probed, returns this firm's real jobs)
#                candidate (target firm, ATS not yet resolved -> detect_ats)
#
# "verified" entries below were probed live and return the named firm's own
# postings. "candidate" entries are real target firms whose ATS is custom /
# Workday / not-yet-found; detect_ats.py tries to resolve them each run, and
# until then they are covered (best-effort) via the aggregator/LinkedIn layer.
# ============================================================================

